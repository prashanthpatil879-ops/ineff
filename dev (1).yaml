env: dev
catalog: gfdo_dev_catalog
secret_scope: cacd-gftsupp-risk-akv-scope

logging:
  level: INFO

env_table_prefix: ""

secrets:
  tenant_id_key: RDATenantId
  client_id_key: RDASPNId
  client_secret_key: RDASPNSecret

artifactory:
  url: artifactory.platform.manulife.io/artifactory/api/pypi/pypi-remote/simple
  serviceaccount_key: RDAServiceAccount
  token_key: RDAArtifactoryToken

sqlmi:
  server: "azcacsqlgftrdagen2dev.database.windows.net"
  database: "RDAGen2DB"
  hostNameInCertificate: "*.database.windows.net"

ec_table_prefix: irr_ec_forecasting
ear_table_prefix: irr_ear_reporting
ear_forecast_table_prefix: irr_ear_forecast
stresstest_prefix: stresstest

schema:
  raw: ${catalog}.gft_rda_raw
  curation: ${catalog}.gft_rda_curation
  semantic: ${catalog}.gft_rda_semantic

adls:
  storage_account: cacdgftsuppriskadls
  rda-app: abfss://rda-app@${adls.storage_account}.dfs.core.windows.net
  landing: abfss://rda-landing@${adls.storage_account}.dfs.core.windows.net
  raw: abfss://rda-raw@${adls.storage_account}.dfs.core.windows.net
  curation: abfss://rda-curated@${adls.storage_account}.dfs.core.windows.net
  semantic: abfss://rda-semantic@${adls.storage_account}.dfs.core.windows.net
  archive: abfss://rda-archive@${adls.storage_account}.dfs.core.windows.net


common:
  ear_forecast_rda_run:
    rda_run_table: ${schema.curation}.${env_table_prefix}${ear_forecast_table_prefix}_rda_run
    rda_run_ext_table_loc: ${adls.curation}/${env_table_prefix}${ear_forecast_table_prefix}_rda_run
  config_files:
    config: ${adls.rda-app}/Config/${env_table_prefix}Config.xlsx
    gam: ${adls.rda-app}/Config/${env_table_prefix}GAMConfig.xlsx
    alm: ${adls.rda-app}/Config/${env_table_prefix}ALMConfig.xlsx
    segment_mapping: ${adls.rda-app}/Config/${env_table_prefix}SMConfig.xlsx
    par_curve: ${adls.rda-app}/Config/${env_table_prefix}ParCurveConfig.xlsx
    forecasting: ${adls.rda-app}/Config/${env_table_prefix}ForecastingConfig.xlsx
    es_driven_impacts: ${adls.rda-app}/Config/${env_table_prefix}ESDrivenImpactsConfig.xlsx
    economicsensitivities: ${adls.rda-app}/Config/${env_table_prefix}ESConfig.xlsx
    embeddedsensitivity: ${adls.rda-app}/Config/${env_table_prefix}EmbeddedSensitivityConfig.xlsx

ingest:
  file:
    gam_sensitivities:
      landing: ${adls.landing}/${env_table_prefix}GAM/
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}GAM
      raw_table: ${schema.raw}.${env_table_prefix}${ear_forecast_table_prefix}_gam_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_forecast_table_prefix}_gam_raw
      raw_table_without_scenario: ${schema.raw}.${env_table_prefix}${ear_forecast_table_prefix}_gam_raw_without_scenario
      raw_ext_table_loc_without_scenario: ${adls.raw}/${env_table_prefix}${ear_forecast_table_prefix}_gam_raw_without_scenario
      raw_table_mlrl: ${schema.raw}.${env_table_prefix}ifrs17_consolidated_sensitivities_results_mlrl_split_ratios
      raw_ext_table_mlrl_loc: ${adls.raw}/${env_table_prefix}ifrs17_consolidated_sensitivities_results_mlrl_split_ratios
      raw_table_dbpension: ${schema.raw}.${env_table_prefix}ifrs17_consolidated_sensitivities_results_db_pension
      raw_ext_table_dbpension_loc: ${adls.raw}/${env_table_prefix}ifrs17_consolidated_sensitivities_results_db_pension
      file_pattern: IFRS17.*Consolidated Sensitivities Results.*.xlsb
    alm:
      landing: ${adls.landing}/${env_table_prefix}ALM/
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}ALM
      raw_table: ${schema.raw}.${env_table_prefix}${ear_forecast_table_prefix}_alm_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_forecast_table_prefix}_alm_raw
      file_pattern: IFRS17 Sensitivities Forecast.*.xlsx
    gam_segmentmapping:
      landing: ${adls.landing}/${env_table_prefix}SegmentMapping/
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}SegmentMapping
      raw_table: ${schema.raw}.${env_table_prefix}${ear_forecast_table_prefix}_segmentmapping_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_forecast_table_prefix}_segmentmapping_raw
      file_pattern: IFRS17.*Consolidated Sensitivities Segment Mapping.*.xlsx
    ear_par_curve:
      landing: ${adls.landing}/${env_table_prefix}ParCurve/
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}ParCurve
      raw_table: ${schema.raw}.${env_table_prefix}${ear_forecast_table_prefix}_parcurve_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_forecast_table_prefix}_parcurve_raw
      file_pattern: .*Interest Rate Report.*.xlsx
    ear_reference_portfolio:
      landing: ${adls.landing}/${env_table_prefix}ReferencePortfolio/
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}ReferencePortfolio
      raw_table: ${schema.raw}.${env_table_prefix}${ear_forecast_table_prefix}_referenceportfolio_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_forecast_table_prefix}_referenceportfolio_raw
      file_pattern: .*ReferencePortfolios.*.xlsx
    economicsensitivities:
      landing: ${adls.landing}/${env_table_prefix}EconomicSensitivities/
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}EconomicSensitivities
      raw_table: ${schema.raw}.${env_table_prefix}ifrs17_economic_sensitivities_template
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}ifrs17_economic_sensitivities_template
      file_pattern: IFRS17.*economic sensitivities.*.xlsb
    embeddedsensitivity:
      landing: ${adls.landing}/${env_table_prefix}EmbeddedSensitivity/
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}EmbeddedSensitivity
      raw_table: ${schema.raw}.${env_table_prefix}ca_us_sg_forecast
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}ca_us_sg_forecast
      file_pattern: .*CA_US_SG - Forecast.*.xlsm
    fx:
      landing: ${adls.landing}/${env_table_prefix}FX/
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}FX
      file_pattern: Monthly GAAP Rates Distribution file*.csv
      file_format: csv
      options:
        header: true
        inferSchema: true
        delimiter: ","
      column_renames:
        old_col_names: ["IS/RATE", "BS/RATE"]
        new_col_names: ["IS_RATE", "BS_RATE"]
      partition_col: DATE
      raw_table: ${schema.raw}.${env_table_prefix}${ec_table_prefix}_ifs_fx_rates_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ec_table_prefix}_ifs_fx_rates_raw
    parcurve_ec:
      landing: ${adls.landing}/${env_table_prefix}ParCurveEC/
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}ParCurveEC
      file_pattern: Market Curve sample file*
      file_format: excel
      sheets:
        sheet1: 
          options:
            sheet_name: "Scope 2. Risk Free"
            header: 0
          column_renames:
            old_col_names: ["Corp_Spread_Rating "]
            new_col_names: ["Corp_Spread_Rating"]
          column_drops: ["RMDB.dbo.v_CurveRates"]
          column_adds:
            RateType: "Risk Free"
            UnderlyingDataDate: "NaN"
        sheet2: 
          options:
            sheet_name: "Scope 1. Corp Spread"
            header: 0
          column_renames:
            old_col_names: ["Corp_Spread_Rating "]
            new_col_names: ["Corp_Spread_Rating"]
          column_drops: ["RMDB.dbo.v_CurveAlmCorpRates"]
          column_adds:
            RateType: "Corp Spread"
            UnderlyingDataDate: "NaN"
      raw_table: ${schema.raw}.${env_table_prefix}${ec_table_prefix}_alm_curve_rates_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ec_table_prefix}_alm_curve_rates_raw
    ec_lower_bound:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EC/LowerBound
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EC/LowerBound
      file_pattern: RDA_EC_Lower*.csv
      file_format: csv
      options:
        header: true
        inferSchema: true
        delimiter: ","
      raw_table: ${schema.raw}.${env_table_prefix}${ec_table_prefix}_lower_bound_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ec_table_prefix}_lower_bound_raw
    ec_upper_bound:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EC/UpperBound
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EC/UpperBound
      file_pattern: RDA_EC_Upper*.csv
      file_format: csv
      options:
        header: true
        inferSchema: true
        delimiter: ","
      raw_table: ${schema.raw}.${ec_table_prefix}_upper_bound_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ec_table_prefix}_upper_bound_raw
    ref_portfolio_code:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EC/RefPortCode
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EC/RefPortCode
      file_pattern: RefPortCode*
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "in"
            header: 0
      raw_table: ${schema.raw}.${ec_table_prefix}_reference_portfolio_code_raw
      raw_ext_table_loc: ${adls.raw}/${ec_table_prefix}_reference_portfolio_code_raw
    exclusion_mapping:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EAR/ExclusionMapping
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EAR/ExclusionMapping
      file_pattern: TAMSegment_Exclusion_Mapping*.csv
      file_format: csv
      options:
        header: true
        inferSchema: true
        delimiter: ","
      raw_table: ${schema.raw}.${env_table_prefix}${ear_table_prefix}_tamsegment_exclusion_mapping_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_table_prefix}_tamsegment_exclusion_mapping_raw
    iq_ec_forecast:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EC/IQECForecast
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EC/IQECForecast
      file_pattern: IR EC*
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "IR EC"
            header: 0
      raw_table: ${schema.raw}.${env_table_prefix}${ec_table_prefix}_iq_ec_forecast_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ec_table_prefix}_iq_ec_forecast_raw
    factor_scenarios:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/StressTest/Factor Scenarios
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/StressTest/Factor Scenarios
      file_pattern: "*.XLS"
      file_format: excel
      detail_config:
        FACTOR:
          sheet_name: "Factor"
          detail_skiprows: 21
          has_subtype: False
          cast_column: "Shock"
          metadata_configs:
            - nrows: 8
            - skiprows: 10
              nrows: 10
      mandatory_columns: ["Risk Model", "Scenario Type", "Correlated Mode", "Scenario Name"]
      metadata_columns: ["Risk Model", "Scenario Type", "Correlated Mode", "Scenario Name", "Scenario Owner", "Base Currency", 
                        "Credit Market", "Floor nominal rates to zero", "Interpolate rate shocks", "Enable full valuation for Securitized Assets", 
                        "Apply Filter to Shock Variable", "Equity", "Currency", "Inflation", "Spread (DTS)", "Spread (Duration)", "Term Structure", 
                        "Commodity", "Private Equity", "Private Real Estate", "Private Infrastructure"]
      master_table:
        raw_table: ${schema.raw}.${env_table_prefix}${stresstest_prefix}_scenario_master_raw
        raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${stresstest_prefix}_scenario_master_raw
      scenario_table:
        raw_table: ${schema.raw}.${env_table_prefix}${stresstest_prefix}_b1_factor_scenario_raw
        raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${stresstest_prefix}_b1_factor_scenario_raw
    market_scenarios:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/StressTest/Market Scenarios
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/StressTest/Market Scenarios
      file_pattern: "*.XLS"
      file_format: excel
      detail_config:
        FACTOR:
          sheet_name: "Market"
          detail_skiprows: 12
          has_subtype: True
          cast_column: "Shock Amount"
          metadata_configs:
            - nrows: 11
      mandatory_columns: ["Risk Model", "Scenario Type", "Correlated Mode", "Scenario Name"]
      metadata_columns: ["Risk Model", "Scenario Type", "Correlated Mode", "Scenario Name", "Scenario Owner", "Base Currency", 
                        "Credit Market", "Floor nominal rates to zero", "Interpolate rate shocks", "Enable full valuation for Securitized Assets", 
                        "Apply Filter to Shock Variable", "Equity", "Currency", "Inflation", "Spread (DTS)", "Spread (Duration)", "Term Structure", 
                        "Commodity", "Private Equity", "Private Real Estate", "Private Infrastructure"]
      master_table:
        raw_table: ${schema.raw}.${env_table_prefix}${stresstest_prefix}_scenario_master_raw
        raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${stresstest_prefix}_scenario_master_raw
      scenario_table:
        raw_table: ${schema.raw}.${env_table_prefix}${stresstest_prefix}_b1_market_scenario_raw
        raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${stresstest_prefix}_b1_market_scenario_raw
    alm_liability_cf:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EC/ALM_Liability_CF
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EC/ALM_Liability_CF
      file_pattern: ALM System Output*
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "Data"
            header: 0
          column_drops: ['Amount in CAD']  
          column_type_overrides:
            AS_OF_DATE: date
            CASHFLOW_DATE: date
      raw_table: ${schema.raw}.${env_table_prefix}${ec_table_prefix}_shev_liability_cf_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ec_table_prefix}_shev_liability_cf_raw
    ga_barraone_stress_test:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/StressTest/GA_BarraOne
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/StressTest/GA_BarraOne
      file_pattern: GA Stress Test Data Final File Extract*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "File Extract"
            header: 0
          column_renames:
            old_col_names: ["Portfolio Code", "Adjusted Asset Group", "Initial Market Value", "Analysis Date", "Scenario Name", "Risk Model", "Final Market Value", "P&L", "$P&L"]
            new_col_names: ["PORTFOLIO_CODE", "ADJUSTED_ASSET_GROUP", "INITIAL_MARKET_VALUE", "ANALYSIS_DATE", "SCENARIO_NAME", "RISK_MODEL", "FINAL_MARKET_VALUE", "P&L_RATE", "PNL_AMT"]
          column_type_overrides:
            ANALYSIS_DATE: date
      raw_table: ${schema.raw}.${env_table_prefix}${stresstest_prefix}_ga_b1_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${stresstest_prefix}_ga_b1_raw
    dv01_all_asset_derivative:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EAR/DV01
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EAR/DV01
      file_pattern: DV01_Derivatives_ALL_Asset_Derivative_*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "Sheet1"
            header: 0
          column_type_overrides: 
            RBL_INTERNAL_LENTITY: string
            REPORT_DATE: date
            MATURITY_DATE: date
            MATURITY_DATE_FOR_VALUATION: date
            RINGFENCE_EFFECTIVE_DATE: date
            RINGFENCE_EXPIRY_DATE: date
      raw_table: ${schema.raw}.${env_table_prefix}${ear_table_prefix}_dv01_all_asset_derivative_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_table_prefix}_dv01_all_asset_derivative_raw
    asset_summary_bd09:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EAR/Asset_Summary_BD09
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EAR/Asset_Summary_BD09
      file_pattern: Asset_Summary_BD09_*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "Sheet1"
            header: 0
          column_type_overrides:
            SUBFUND: string
            ASSET_PRIMARYID: string
            RBL_INTERNAL_LENTITY: string
            REPORT_DATE: date
            MATURITY_DATE: date
            RINGFENCE_EFFECTIVE_DATE: date
            RINGFENCE_EXPIRY_DATE: date
            UPDATED_DATETIME: timestamp
      raw_table: ${schema.raw}.${env_table_prefix}${ear_table_prefix}_asset_summary_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_table_prefix}_asset_summary_raw
    swap_spread_interest_rate_ec:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EC/InterestRateEC
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}InterestRateEC
      exclude_values: ["US", "Asia", "Reinsurance", "Surplus", "Total Company", "LLP", "Country", "SS", "Current Quarter EC", "LLP Current Quarter EC"]
      file_pattern: Interest Rate_EC*
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "#Swap Spread EC"
            skiprows: 14
            usecols: "D,F"
            header: null
            names:
              - LLP_NAME
              - AMOUNT
          column_type_overrides:
            AMOUNT: decimal
      raw_table: ${schema.raw}.${env_table_prefix}${ec_table_prefix}_swap_spread_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ec_table_prefix}_swap_spread_raw
    dv01_derivatives:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EAR/DV01_Derivatives
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EAR/DV01_Derivatives
      file_pattern: DV01_Derivatives*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "Sheet1"
            header: 0
          column_type_overrides:
            INCEPTION_DATE: date
      raw_table: ${schema.raw}.${env_table_prefix}${ear_table_prefix}_dv01_derivatives_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_table_prefix}_dv01_derivatives_raw
    dv01_fi:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EAR/DV01_FI
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EAR/DV01_FI
      file_pattern: DV01_FI*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "Sheet1"
            header: 0
          column_type_overrides:
            INCEPTION_DATE: date
      raw_table: ${schema.raw}.${env_table_prefix}${ear_table_prefix}_dv01_fi_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_table_prefix}_dv01_fi_raw
    dv01_liab_post_hp:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EAR/DV01_Liab_PostHP
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EAR/DV01_Liab_PostHP
      file_pattern: DV01_Liab_PostHP*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "Sheet1"
            header: 0
          column_type_overrides:
            INCEPTION_DATE: date
      raw_table: ${schema.raw}.${env_table_prefix}${ear_table_prefix}_dv01_liab_post_hp_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_table_prefix}_dv01_liab_post_hp_raw
    hedge_proportion:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EAR/Hedge_Proportion
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EAR/Hedge_Proportion
      file_pattern: Hedge_Proportion*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "Sheet1"
            header: 0
          column_type_overrides:
            EFFECTIVE_DATE: date
            CASHFLOW_DATE: date
      raw_table: ${schema.raw}.${env_table_prefix}${ear_table_prefix}_hedge_proportion_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_table_prefix}_hedge_proportion_raw
    liab_cf:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EAR/Liab_CF
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EAR/Liab_CF
      file_pattern: Liab_CF*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "Sheet1"
            header: 0
          column_type_overrides:
            AS_OF_DATE: date
            DATE: date
      raw_table: ${schema.raw}.${env_table_prefix}${ear_table_prefix}_liab_cf_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_table_prefix}_liab_cf_raw
    ha_fi_sensitivity_obs:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/EAR/HA_FI_Sensitivity_OBS
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/EAR/HA_FI_Sensitivity_OBS
      file_pattern: HA_FI_Sensitivity_OBS*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "Sheet1"
            header: 0
          column_type_overrides:
            REPORT_DATE: date
      raw_table: ${schema.raw}.${env_table_prefix}${ear_table_prefix}_ha_fi_sensitivity_obs_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${ear_table_prefix}_ha_fi_sensitivity_obs_raw
    bf_barraone_st_propagation:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/StressTest/ST_Propagation
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/StressTest/ST_Propagation
      file_pattern: bf_barraone_st_propagation_*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
            sheet_name: "in"
            header: 0
          column_type_overrides:
            Analysis_Dt: date
            sys_eff_date_from: date
            sys_eff_date_to: date
      raw_table: ${schema.raw}.${env_table_prefix}${stresstest_prefix}_bf_barraone_st_propagation_raw
      raw_ext_table_loc: ${adls.raw}/${env_table_prefix}${stresstest_prefix}_bf_barraone_st_propagation_raw
    b1_Country_Currency_Mapping:
      landing: ${adls.landing}/${env_table_prefix}RiskAnalyst/StressTest/B1_Country_Currency_Mapping
      archive: ${adls.archive}/YYYYMMDD/${env_table_prefix}RiskAnalyst/StressTest/B1_Country_Currency_Mapping
      file_pattern: Country_Currency_BarraOne*.xlsx
      file_format: excel
      sheets:
        sheet1:
          options:
