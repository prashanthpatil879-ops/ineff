    source_table_or_query: dbo.Dim_Tenors
    target_table: ${schema.semantic}.${env_table_prefix}irr_mapping_dim_tenors
    ext_table_loc: ${adls.semantic}/${env_table_prefix}irr_mapping_dim_tenors
  irr_mapping_dim_bey_row_tenor:
