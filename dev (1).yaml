cache:
  irr_mapping_dim_date:
    refresh_freq: daily # Allowed: daily, monthly, quarterly, semi-annunally, annunally
    source_table_or_query: dbo.Dim_Date
    target_table: ${schema.semantic}.${env_table_prefix}irr_mapping_dim_date
    ext_table_loc: ${adls.semantic}/${env_table_prefix}irr_mapping_dim_date
  irr_mapping_llp_to_target_currency:
    refresh_freq: daily # Allowed: daily, monthly, quarterly, semi-annunally, annunally
    source_table_or_query: |
      select d_llp.Lowest_Level_Portfolio_Name, d_cur.Currency_Alpha_Code
      from
      dbo.Dim_Lowest_Level_Portfolio d_llp
      join
      dbo.Dim_Currency d_cur
      on d_llp.Target_Currency_Key = d_cur.Currency_Key
      where d_llp.Is_Active = 1 and d_cur.Is_Active = 1 and d_cur.Currency_Alpha_Code is not NULL
    target_table: ${schema.semantic}.${env_table_prefix}irr_mapping_llp_to_target_currency
    ext_table_loc: ${adls.semantic}/${env_table_prefix}irr_mapping_llp_to_target_currency
  irr_mapping_heirarchy_mapping_latest:
    refresh_freq: daily # Allowed: daily, monthly, quarterly, semi-annunally, annunally
    source_table_or_query: dbo.vHeirarchyMappingLatest
    target_table: ${schema.semantic}.${env_table_prefix}irr_mapping_heirarchy_mapping_latest
    ext_table_loc: ${adls.semantic}/${env_table_prefix}irr_mapping_heirarchy_mapping_latest
  irr_mapping_dim_forecast_date:
    refresh_freq: daily # Allowed: daily, monthly, quarterly, semi-annunally, annunally
    source_table_or_query: dbo.Dim_Forecast_Date
    target_table: ${schema.semantic}.${env_table_prefix}irr_mapping_dim_forecast_date
    ext_table_loc: ${adls.semantic}/${env_table_prefix}irr_mapping_dim_forecast_date
  irr_mapping_dim_tenors:
